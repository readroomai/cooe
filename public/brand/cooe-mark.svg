<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cooe mark">
  <defs>
    <radialGradient id="core" cx="46%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ff4d05"/>
      <stop offset="26%" stop-color="#ff6a1e"/>
      <stop offset="47%" stop-color="#ff8a5c" stop-opacity="0.72"/>
      <stop offset="63%" stop-color="#ffad96" stop-opacity="0.34"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="46%" cy="66%" r="55%">
      <stop offset="0%" stop-color="#ff96b0" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#ffb7c9" stop-opacity="0.62"/>
      <stop offset="52%" stop-color="#ffd6e0" stop-opacity="0.3"/>
      <stop offset="74%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComposite operator="in" in="g" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#fcfbf9"/>
  <g filter="url(#soften)">
    <circle cx="256" cy="248" r="196" fill="url(#core)"/>
    <circle cx="278" cy="300" r="168" fill="url(#bloom)"/>
  </g>
  <circle cx="256" cy="256" r="200" fill="#000" opacity="0.06" filter="url(#grain)"/>
</svg>
